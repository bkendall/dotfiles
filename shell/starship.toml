# Starship configuration matching the classic bryankendall Zsh prompt
add_newline = false

# Format layout: hostname:directory(git_commit|git_branch git_status) jobs character
format = "$hostname:$directory$git_commit$git_branch$git_status$jobs $character"
right_format = ""

[hostname]
ssh_only = false
style = "bold green"
format = '[$hostname]($style)'

[directory]
style = "bold magenta"
truncation_length = 1
format = '[$path]($style)'

[git_commit]
commit_hash_length = 7
only_detached = false
tag_disabled = true
style = "bold cyan"
format = '[\($hash]($style)'

[git_branch]
symbol = "|"
style = "bold cyan"
format = '[$symbol$branch]($style)'

[git_status]
style = "bold cyan"
format = '[$all_status$ahead_behind]($style)\)'
conflicted = "═"
ahead = "!"
behind = "⇡"
diverged = "⇕"
untracked = "✭"
stashed = ""
modified = "?"
staged = "+"
renamed = "➜"
deleted = "✖"

[jobs]
symbol = "§"
style = "bold magenta"
format = ' [$symbol]($style)'

[character]
success_symbol = "[»](bold green)"
error_symbol = "[»](bold red)"
vimcmd_symbol = "[»](bold green)"

# Disable unnecessary language and cloud environment modules
[package]
disabled = true

[python]
disabled = true

[gcloud]
disabled = true

[aws]
disabled = true

[docker_context]
disabled = true

[nodejs]
disabled = true

[ruby]
disabled = true

[golang]
disabled = true

[cmd_duration]
disabled = true
