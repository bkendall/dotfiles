# Starship configuration for Citc workspaces (disables git scanning over FUSE)
add_newline = false

# Format layout: hostname:directory(citc_workspace) jobs character
format = "$hostname:$directory${env_var.CITC_WORKSPACE}$jobs $character"
right_format = ""

[hostname]
ssh_only = false
style = "green"
format = '\[s\][$hostname]($style)'

[directory]
style = "purple"
truncation_length = 1
truncate_to_repo = false
format = '[$path]($style)'

[env_var.CITC_WORKSPACE]
variable = "CITC_WORKSPACE"
style = "cyan"
format = '\([$env_value]($style)\)'

[jobs]
symbol = "§"
style = "bold purple"
format = ' [$symbol]($style)'

[character]
success_symbol = "[»](bold green)"
error_symbol = "[»](bold red)"
vimcmd_symbol = "[»](bold green)"

# Disable git modules to prevent slow network FUSE stat calls in Citc
[git_branch]
disabled = true

[git_commit]
disabled = true

[git_status]
disabled = true

[git_state]
disabled = true

[git_metrics]
disabled = true

# Disable unnecessary language and cloud environment modules
[package]
disabled = true

[python]
disabled = true

[gcloud]
disabled = true

[aws]
disabled = true

[docker_context]
disabled = true

[nodejs]
disabled = true

[ruby]
disabled = true

[golang]
disabled = true

[cmd_duration]
disabled = true
